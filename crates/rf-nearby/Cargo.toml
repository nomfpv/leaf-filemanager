[package]
name = "rf-nearby"
description = "Send files to leaf on other devices in the same network: discovery (mDNS), pairing and transfer (QUIC). Platform-free: Windows, macOS, Linux."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros", "net"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
# the LocalSend side (localsend.rs): HTTPS on the rustls above, no second TLS stack
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
httparse = "1"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
leaf-download.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
mdns-sd = "0.13"
blake3 = "1"
unicode-normalization = "0.1"
ring = "0.17"

[dev-dependencies]
tempfile = "3"
