[package]
name = "leaf-decode"
description = "leaf: portable JPEG XL and AVIF decoders (pure Rust, no system calls), used when the system has no codec"
version.workspace = true
edition.workspace = true
license = "MIT"
publish.workspace = true

[dependencies]
anyhow.workspace = true
image = { workspace = true }
jxl-oxide = { version = "0.12", default-features = false }
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
