[package]
name = "leaf-remote"
description = "leaf: places on other machines (SFTP over russh, FTP/FTPS over suppaftp) behind the leaf-vfs interface"
version.workspace = true
edition.workspace = true
license = "MIT"
publish.workspace = true

[dependencies]
rf-core.workspace = true
leaf-vfs.workspace = true
leaf-sys.workspace = true
# hosts set to "Through VPN" are dialled through leaf's VPN (which runs on this crate's runtime)
leaf-vpn.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
# pure Rust SSH; `ring` instead of the default aws-lc-rs (that one needs cmake and nasm to build on Windows)
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
# hashed known_hosts entries (|1|salt|hash: HMAC-SHA1)
hmac = "0.12"
sha1.workspace = true
base64 = "0.22"
# passwords and key files in memory are wiped when dropped
zeroize = "1"
# FTP and FTPS (W1c): the blocking client on leaf's own worker threads; TLS through rustls with ring (as rf-nearby has it)
suppaftp = { version = "13", default-features = false, features = ["rustls-ring", "deprecated"] }
# (`deprecated`: implicit TLS on port 990)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
# FTPS certificates are checked against the system's store (Windows: CryptoAPI)
rustls-platform-verifier = "0.7"
sha2.workspace = true
# saved passwords and passphrases (W1b): the system's keyring behind leaf's own seam (`secrets.rs`)
keyring-core = "1"

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Secret Service over zbus (zbus is in the tree already; the D-Bus C library is not needed); its own runtime choice
# (async-io), not left to another crate's zbus features
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
leaf-vfs = { workspace = true, features = ["suite"] }
