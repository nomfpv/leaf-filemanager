[package]
name = "leaf-download"
description = "leaf: HTTP/HTTPS downloads in segments with resume (portable, no async runtime)"
version.workspace = true
edition.workspace = true
license = "MIT"
publish.workspace = true

[dependencies]
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# blocking HTTP client; rustls with ring is already in the tree (no new TLS stack, no async runtime)
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
