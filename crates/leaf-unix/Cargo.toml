[package]
name = "leaf-unix"
description = "leaf: the Linux platform backend (the twin of rf-win), reached through leaf-sys"
version.workspace = true
edition.workspace = true
license = "MIT"
publish.workspace = true

[dependencies]
leaf-common.workspace = true
leaf-decode.workspace = true
rf-core.workspace = true
# every stub of a function that returns Result answers `anyhow::Result` (rf-win's windows::core::Result becomes anyhow's)
anyhow.workspace = true
log.workspace = true
dirs.workspace = true
libc = "0.2"
chrono.workspace = true
serde.workspace = true
# the name index: inotify watchers and locks (both already in the tree through rf-win)
notify.workspace = true
parking_lot.workspace = true
# pictures: the same decoders as on Windows' image-crate path (leaf-decode adds JPEG XL and AVIF)
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga", "qoi", "exr", "hdr", "dds", "pnm"] }
kamadak-exif = "0.6"
# SVG icons of the system icon theme (already in the tree through rf-win)
resvg = { version = "0.46", default-features = false }
