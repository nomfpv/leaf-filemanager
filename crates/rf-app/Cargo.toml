[package]
name = "rf-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "leaf"
path = "src/main.rs"

[[bin]]
name = "leaf-look"
path = "src/bin/leaf-look.rs"

[dependencies]
rf-core.workspace = true
leaf-sys.workspace = true
leaf-decode.workspace = true
leaf-dev.workspace = true
# installer and auto-update (GitHub Releases)
velopack = "=1.2.161"
rf-archive.workspace = true
rf-nearby.workspace = true
rf-player.workspace = true
rustdecoder.workspace = true
resvg = { version = "0.46", default-features = false }
gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger = "0.11"
parking_lot.workspace = true
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
smallvec.workspace = true
serde.workspace = true
serde_json.workspace = true
# font previews (already in the tree through resvg)
ttf-parser = "0.25"
# leaf-look: e-mail (.eml) previews
mail-parser = "1.0"
toml.workspace = true
dirs.workspace = true
crossbeam-channel.workspace = true
futures.workspace = true
image.workspace = true
raw-window-handle.workspace = true
chrono.workspace = true
unicode-bidi = "0.3"
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies]
# Our fork (github.com/gelenmedya/gpui-pre-windows, hybrid GPU/CPU renderer); `gpui_windows::hybrid` is the public API.
gpui-pre-windows = "0.3.11"

[build-dependencies]
embed-resource = "3"
