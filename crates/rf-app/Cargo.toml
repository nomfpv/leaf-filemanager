[package]
name = "rf-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "leaf"
path = "src/main.rs"

[[bin]]
name = "leaf-look"
path = "src/bin/leaf-look.rs"

# the folder handler Windows starts while leaf is the default file manager (starts leaf, or the real Explorer when leaf is gone)
[[bin]]
name = "leaf-open"
path = "src/bin/leaf-open.rs"

[dependencies]
rf-core.workspace = true
leaf-sys.workspace = true
leaf-decode.workspace = true
leaf-dev.workspace = true
leaf-vfs.workspace = true
# sftp:// (russh, pure Rust; its runtime starts with the first connection)
leaf-remote.workspace = true
leaf-download.workspace = true
leaf-ytdlp.workspace = true
# Usenet (NZB) downloads: NNTP, yEnc, par2, unpack (usenet.rs is its face)
leaf-nzb.workspace = true
# leaf's VPN (leaf's own connections only; the tunnel runs on leaf-remote's runtime)
leaf-vpn.workspace = true
# the VPN's sign-in text is wiped when dropped
zeroize = "1"
leaf-sync.workspace = true
# shared folders with a friend's leaf (Share with a friend..., Join shared folder...)
leaf-share.workspace = true
# leaf-open.exe, built next to leaf.exe
leaf-open.workspace = true
leaf-agents.workspace = true
# cache file names of fetched server files (a hash of the address)
sha2.workspace = true
# installer and auto-update (GitHub Releases)
velopack = "=1.2.161"
rf-archive.workspace = true
rf-nearby.workspace = true
rf-player.workspace = true
rustdecoder.workspace = true
resvg = { version = "0.46", default-features = false }
gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger = "0.11"
parking_lot.workspace = true
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
smallvec.workspace = true
serde.workspace = true
serde_json.workspace = true
# font previews (already in the tree through resvg)
ttf-parser = "0.25"
# leaf-look: e-mail (.eml) previews
mail-parser = "1.0"
toml.workspace = true
dirs.workspace = true
crossbeam-channel.workspace = true
futures.workspace = true
image.workspace = true
raw-window-handle.workspace = true
chrono.workspace = true
unicode-bidi = "0.3"
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies]
# Our fork (github.com/gelenmedya/gpui-pre-windows, hybrid GPU/CPU renderer); `gpui_windows::hybrid` is the public API.
gpui-pre-windows = "0.3.11"

[build-dependencies]
embed-resource = "3"
