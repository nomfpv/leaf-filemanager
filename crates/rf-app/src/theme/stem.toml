# Stem: calm near-black with a green undertone; one thin accent line, the stem, marks where you are.
# Values from the mockup direction-1-stem.html (Standard at the top of each mode, what High changes under it).
name = "Stem"
description = "Calm and solid: the frame one step darker than the content, a thin accent line marks the current place."

backdrop = false
sheet_opacity = 1
radius = 10
control_radius = 6
row_radius = 4
row_height = 32
marker_width = 2
focus_width = 2
tab_marker = 2
tag_dot = 6
name_weight = 400
font_ui = "Segoe UI Variable Text"
font_mono = "Cascadia Mono"
mono_numbers = false

selection = "accent/0.17"
row_selection = "accent/0.17"
selection_border = "#00000000"
cursor = "accent/0.70"
focus = "accent"
titlebar = "#00000000"
stripe = "#00000000"

# Pass 2: structure (sheets, sizes, markers).
