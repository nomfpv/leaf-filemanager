# Index: light first, dense and technical; a ruled table with zebra rows, a solid accent selection, monospace number columns
# and an inverted status line. Values from the mockup direction-3-index.html (Standard at the top of each mode, what High changes).
name = "Index"
description = "Dense and technical: ruled rows, zebra stripes, solid selection, monospace numbers."

backdrop = false
sheet_opacity = 1
radius = 3
control_radius = 2
row_radius = 0
# (the mockup's Index opens compact: 22 px rows, about 30 of them where Stem shows 19)
row_height = 22
marker_width = 0
focus_width = 3
tab_marker = 0
tag_dot = 6
name_weight = 400
font_ui = "Bahnschrift"
font_mono = "Cascadia Mono"
mono_numbers = true

selection = "accent/0.30"
row_selection = "accent"
selection_border = "#00000000"
row_selection_text = "accent_text"
cursor = "accent_text"
focus = "accent"
titlebar = "#00000000"

# Pass 2: structure (sheets, sizes, markers).
material = "mica"
gap = 0
sheet_edge = "#00000000"
sheet_shadow = "#00000000"
sheet_shadow_blur = 0
focus_ring = "#00000000"
pane_marker = "band"
tab_shape = "card"
numbered_tabs = true
key_caps = true
titlebar_height = 36
tab_width = 188
tab_height = 31
toolbar_height = 40
typebar_height = 28
pane_header_height = 32
header_height = 26
status_height = 28
sidebar_row = 26
font_size = 13
font_size_small = 12
font_size_xs = 11
header_fill = "#00000000"
place_border = "#00000000"
selection_inactive_border = "#00000000"

# Pass 3: the ruled table and the readout.
header_rules = true
date_style = "iso"
tile_width = 120
tile_radius = 0
section_rule = true
home_row = 156
square_marks = true
mono_chrome = true

