# Canopy: frosted sheets over the window backdrop (Mica, Acrylic or glass). The default theme.
# Values from the mockup direction-2-canopy.html (Standard at the top of each mode, what High changes under it).
name = "Canopy"
description = "Frosted glass: translucent sheets over the window backdrop, soft borders."

backdrop = true
radius = 14
control_radius = 8
row_radius = 8
row_height = 32
marker_width = 0
focus_width = 1
tab_marker = 0
tag_dot = 6
name_weight = 400
font_ui = "Segoe UI Variable Text"
font_mono = "Cascadia Mono"
mono_numbers = false

selection = "accent/0.24"
row_selection = "accent/0.24"
selection_border = "accent/0.38"
cursor = "accent/0.85"
focus = "accent/0.55"
titlebar = "#00000000"
stripe = "#00000000"

# Pass 2: structure (sheets, sizes, markers).
material = "acrylic"
gap = 8
sheet_shadow_blur = 32
pane_marker = "rim"
tab_shape = "pill"
numbered_tabs = false
key_caps = false
titlebar_height = 52
tab_width = 200
tab_height = 36
toolbar_height = 48
typebar_height = 32
pane_header_height = 40
header_height = 28
status_height = 36
sidebar_row = 32
font_size = 13
font_size_small = 12
font_size_xs = 11
place = "accent/0.24"
place_border = "accent/0.30"
selection_inactive_border = "#00000000"

# Pass 3: the keys Stem and Index use for their own structure (Canopy: the rounded header strip, 12 px cards).
header_rules = false
date_style = ""
tile_width = 0
tile_radius = 12
section_rule = false
square_marks = false
mono_chrome = false

