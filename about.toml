# cargo-about configuration: the licences accepted for rf-app's Windows dependency tree.
# Regenerate THIRD-PARTY.md with tools\third-party.ps1.
#
# Every licence below was checked against the tree. MPL-2.0 is the only copyleft one (file-level,
# crates used unmodified from crates.io); it is accepted so the list is complete, and tools\third-party.ps1
# fails on anything not listed here, so a new licence is always looked at by a person first.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MIT-0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
